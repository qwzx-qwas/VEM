      - {id: P0-T0A0, title: Read-only inventory the staging identity baseline dirty and untracked payload target readiness ext4 capacity case collisions and migration plan, contracts: [EDGE-PREFLIGHT-001], status: done, depends_on: [], tests: [Git-top-level device-inode source-baseline-HEAD dirty-bundle untracked-manifest target-collision ext4-capacity permission case-collision and no-target-mutation checks]}
      - {id: P0-T0A1, title: Execute owner-authorized prefix-normalized migration layout commit and single-writer cutover while retaining the source as read-only rollback, contracts: [EDGE-PREFLIGHT-001], status: done, depends_on: [P0-T0A0], tests: [source-baseline-parent prefix-normalized-content-hash dirty-payload-preservation clean-target non-nested-Git-root single-writer and read-only-rollback checks]}
      - {id: P0-T0A2, title: Define the preflight evidence schema and exact reproducible Node-pnpm bootstrap decision at the migrated Git root, contracts: [EDGE-PREFLIGHT-001], status: done, depends_on: [P0-T0A1], tests: [evidence-schema machine-classified-result Node-LTS pnpm-exact version-command and secret-redaction checks]}
      - {id: P0-T0B, title: Probe registry proxy CA disk path case symlink pnpm install and ext4 watcher-HMR behavior, contracts: [EDGE-PREFLIGHT-001], status: done, depends_on: [P0-T0A2], tests: [registry-proxy-CA disk path case symlink frozen-install ext4-watcher and HMR-latency checks]}
      - {id: P0-T0C, title: Probe direct Windows Edge Stable binary launch interop and enterprise-policy classification, contracts: [EDGE-PREFLIGHT-001], status: done, depends_on: [P0-T0A1], tests: [Edge-binary direct-headless-smoke version interop cleanup and policy-classification checks]}
      - {id: P0-T0D, title: Probe Windows-WSL HTTP WebSocket HMR loopback exposure port-close and restart path, contracts: [EDGE-PREFLIGHT-001], status: done, depends_on: [P0-T0B, P0-T0C], tests: [Windows-WSL HTTP-WebSocket-HMR two-process non-loopback-refusal port-close and restart checks]}
      - {id: P0-T0E, title: Probe ext4 private runtime owner mode cleanup and reject DrvFS ACL evidence, contracts: [EDGE-PREFLIGHT-001], status: done, depends_on: [P0-T0A1], tests: [runtime-directory owner-mode other-subject refusal cleanup and DrvFS-ACL-rejection checks]}
      - {id: P0-T0F, title: Record preflight ADR aggregate signed-hash evidence and pass-or-block verdict, contracts: [EDGE-PREFLIGHT-001], status: done, depends_on: [P0-T0D, P0-T0E], tests: [evidence hash completeness redaction reproducibility aggregate-verdict and fail-closed checks]}
