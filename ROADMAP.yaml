  - id: R0
    title: Owner-authorized independent recovery research after terminal P0 stop
    status: failed
    depends_on: []
    recovery_of_failed_phase: P0
    authorization_ref: docs/decisions/OPEN_DECISIONS.yaml
    scope_boundary: independent-research-no-product-unlock
    gate:
      commands: ["pnpm roadmap:validate", "pnpm build", "pnpm typecheck", "pnpm lint", "pnpm test"]
      requires_decisions: {R0-RECOVERY: continue}
      done_when:
        - P0-T17D stop evidence and P0 failed remain immutable while the validator proves R0 cannot unlock any existing product phase or task.
        - A trusted monotonic receipt ledger distinguishes runner-observed process event and final-response boundaries without claiming model-server or shell-internal timing.
        - A preregistered recovery-only task set uses fresh isolated contexts counterbalance equal base context withheld ground truth and later product holdout exclusion.
        - R0-T4 records an immutable continue adjust or stop verdict; continue authorizes only an owner-reviewed proposal for a separate research implementation phase.
    tasks:
      - {id: R0-T1, title: Record the owner-authorized terminal-stop recovery charter and mechanically enforce its independent no-product-unlock boundary, contracts: [R0-RECOVERY-001], status: done, depends_on: [P0-T17F], tests: [failed-P0 preservation empty-phase-dependency owner-authorization-reference separate-decision-key no-existing-phase-or-task-dependency and continue-does-not-satisfy-P0 checks]}
      - {id: R0-T2, title: Implement a versioned trusted-runner monotonic event-receipt timing ledger with bounded canonical evidence, contracts: [R0-RECOVERY-001], status: done, depends_on: [R0-T1], tests: [process event receipt final-response monotonic-order clock-domain schema size raw-hash cancellation and missing-duplicate-terminal fail-closed checks]}
      - {id: R0-T3, title: Freeze a recovery-only task bank capsule instrumentation and preregistered evidence plan without consuming product holdouts, contracts: [R0-RECOVERY-001], status: done, depends_on: [R0-T2], tests: [fresh-task identity equal-base-context treatment-only-difference counterbalance threshold instrumentation-hash later-holdout-exclusion and pre-result immutability checks]}
      - {id: R0-T4, title: Execute the owner-authorized recovery-only micro-pilot and record the independent R0-RECOVERY verdict, contracts: [R0-RECOVERY-001], status: done, decision_key: R0-RECOVERY, decision_attempt: 1, supersedes_attempt: null, decision: stop, depends_on: [R0-T3], tests: [fresh-context raw-and-ledger-hash correctness wrong-attribution capsule-integrity pairwise-cost no-benefit-stop and continue-adjust-stop verdict checks]}

