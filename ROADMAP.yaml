      - {id: R2-T4, title: Execute a separately owner-authorized R2 recovery batch and record the independent R2-RECOVERY verdict, contracts: [R2-FINAL-OUTPUT-001], status: done, decision_key: R2-RECOVERY, decision_attempt: 1, supersedes_attempt: null, decision: stop, depends_on: [R2-T3], tests: [fresh-context final-file-and-jsonl-consistency raw-ledger-hash correctness wrong-attribution capsule-integrity pairwise-cost failure-evidence and continue-adjust-stop verdict checks]}

