      - {id: R1-T3, title: Freeze a new recovery-only runner capsule instrumentation threshold and evidence preregistration without external calls, contracts: [R1-RUNNER-REMEDIATION-001], status: done, depends_on: [R1-T2], tests: [new-runner-hash fresh-task identity equal-base-context counterbalance threshold product-holdout-exclusion failure-sealing binding pre-result immutability and external-authorization-false checks]}
      - {id: R1-T4, title: Execute a separately owner-authorized R1 recovery batch and record the independent R1-RECOVERY verdict, contracts: [R1-RUNNER-REMEDIATION-001], status: done, decision_key: R1-RECOVERY, decision_attempt: 1, supersedes_attempt: null, decision: stop, depends_on: [R1-T3], tests: [fresh-context raw-and-ledger-hash correctness wrong-attribution capsule-integrity pairwise-cost failure-evidence and continue-adjust-stop verdict checks]}

  - id: R2
